version: '3.8'

services:

  inference:
    build:
      context: .
      dockerfile: Dockerfile.inference
    container_name: vinagrete-inference
    privileged: true # needed for raw picamera access
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
      # - "/dev/video0:/dev/video0"
    volumes:
      - ./data:/app/data
    environment:
      - SERIAL_PORT=/dev/ttyUSB0
      - DATABASE_URL=sqlite:////app/data/vinagrete.db
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vinagrete-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/vinagrete.db
    restart: unless-stopped