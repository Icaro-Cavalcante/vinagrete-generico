services:
  inference:
    build:
      context: .
      dockerfile: Dockerfile.inference
    container_name: vinagrete-inference
    ipc: host
    privileged: true
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - ./data:/app/data
      - ./weights:/app/weights
      - ./inference:/app/inference
      - ./backend:/app/backend
      - ./config.py:/app/config.py
    environment:
      - PYTHONUNBUFFERED=1
      - SERIAL_PORT=/dev/ttyUSB0
      - DATABASE_URL=sqlite:////app/data/vinagrete.db
      - UPLOAD_DIR=/app/data/uploads
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vinagrete-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
    environment:
      - DATABASE_URL=sqlite:////app/data/vinagrete.db
      - UPLOAD_DIR=/app/data/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vinagrete-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped